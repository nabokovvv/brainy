[project]
name = "brainy-bot"
version = "0.1.0"
description = "A fast multilingual Telegram chat with local-first inference"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { file = "LICENSE" }
dependencies = [
    "httpx>=0.28,<1",
    "openai-whisper>=20231117",
    "python-telegram-bot[job-queue]>=22.8,<23",
    "telegramify-markdown>=1.2,<2",
    "torch>=2.3,<3",
]

[project.optional-dependencies]
# Dormant research tools. They are preserved for the future Web ON path but are not
# imported or installed by the local fast-chat runtime.
research = [
    "aiohttp>=3.12,<4",
    "beautifulsoup4>=4.13,<5",
    "scikit-learn>=1.7,<2",
    "sentence-transformers>=5,<6",
    "spacy>=3.8,<4",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<10",
    "ruff>=0.11,<1",
]
audit = [
    "pip-audit>=2.7,<3",
    "safety>=3.4,<4",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
minversion = "8.3"
addopts = ["-ra", "--strict-config", "--strict-markers"]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["charts", "md"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.format]
line-ending = "lf"
