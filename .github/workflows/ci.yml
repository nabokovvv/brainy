name: CI

on:
  push:
  pull_request:

concurrency:
  group: brainy-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    # Self-hosted on the owner's own Mac mini: keeps CI at zero cost and avoids
    # hosted Actions minutes/billing entirely. Requires a runner registered on
    # that machine with this label (see docs/EXECUTION_PLAN.md).
    runs-on: [self-hosted, macos, mac-mini]
    steps:
      - uses: actions/checkout@v4

      - name: Sync dependencies
        run: uv sync --python 3.12

      - name: Compile check
        run: |
          PYTHONPYCACHEPREFIX=/tmp/brainy-pycache uv run python -m compileall -q brainy_core tests *.py

      - name: Ruff check
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Pytest
        run: uv run pytest -q
